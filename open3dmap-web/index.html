    <!-- Firebase SDK v11+ Modular -->
    <script type="module">
        // Import Firebase modules and make them globally available
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js';
        import { getAuth, GoogleAuthProvider, GithubAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut as firebaseSignOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, getDocs, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js';
        import { getStorage, ref as storageRef, deleteObject } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-storage.js';
        import { getAnalytics } from 'https://www.gstatic.com/firebasejs/11.8.1/firebase-analytics.js';

        // Make Firebase modules available globally
        window.firebaseModules = {
            initializeApp, getAuth, getFirestore, getStorage, getAnalytics,
            GoogleAuthProvider, GithubAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult,
            signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut: firebaseSignOut, onAuthStateChanged,
            doc, getDoc, setDoc, updateDoc, deleteDoc, collection, query, where, orderBy, getDocs, addDoc, serverTimestamp,
            storageRef, deleteObject
        };

        // Import Firebase configuration
        const { firebaseConfig } = await import('./js/firebase-config.js');

        try {
            const app = initializeApp(firebaseConfig);
            window.firebaseServices = {
                app,
                auth: getAuth(app),
                firestore: getFirestore(app),
                storage: getStorage(app),
                analytics: getAnalytics(app)
            };
            console.log('✅ Firebase v11 initialized successfully');
            
            // Dispatch event to signal Firebase is ready
            window.dispatchEvent(new CustomEvent('firebaseReady'));
            
        } catch (error) {
            console.error('❌ Firebase initialization error:', error);
            window.firebaseServices = null;
        }
    </script>
